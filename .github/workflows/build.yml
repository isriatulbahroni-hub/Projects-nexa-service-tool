name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --name NexaServiceTool --onefile --windowed --noconfirm --collect-all av --hidden-import qrcode main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaServiceTool-windows
          path: dist/NexaServiceTool.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries for Qt/PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-xinerama0 libxkbcommon0 libxrender1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --name NexaServiceTool --onefile --windowed --noconfirm --collect-all av --hidden-import qrcode main.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaServiceTool-linux
          path: dist/NexaServiceTool
