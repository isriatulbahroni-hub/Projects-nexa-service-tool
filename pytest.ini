[pytest]
# Batasi collection cuma ke folder tests/. Tanpa ini, `pytest -q` (tanpa
# argumen folder) akan scan seluruh repo termasuk core/, dan pytest secara
# default mencocokkan file test dengan pola "test_*.py" ATAU "*_test.py" -
# core/hardware_test.py kebetulan cocok pola kedua ("*_test.py") padahal
# itu bukan file test sama sekali, cuma modul biasa yang isinya kebetulan
# ada kata "test" di namanya (hardware TEST = pengujian hardware device,
# bukan unit test Python). Akibatnya pytest coba import dia sebagai modul
# top-level berdiri sendiri, dan relative import "from .adb import ..."
# di dalamnya gagal (ImportError: attempted relative import).
testpaths = tests
